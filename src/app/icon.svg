<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .plate{fill:#9a2b22}
    .mark{fill:#f4f5f2}
    /* следует за системой, а не за переключателем на странице */
    @media (prefers-color-scheme: dark){
      .plate{fill:#e2705f}
      .mark{fill:#17191a}
    }
  </style>
  <rect class="plate" width="64" height="64" rx="6"/>
  <text class="mark" x="32" y="42" font-family="'IBM Plex Mono', monospace" font-size="27"
        font-weight="600" text-anchor="middle">KI</text>
</svg>
